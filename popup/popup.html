<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 音量鎖定 ＆ 純音模式</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header: 簡約標題列 + 總開關 -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </div>
        <div class="brand-info">
          <div class="title-row">
            <h1 class="brand-title">YT 音量鎖定</h1>
            <span class="brand-badge">純音版</span>
          </div>
          <span class="brand-desc">太小調高・太大調低・無偏隨機</span>
        </div>
      </div>
      
      <!-- 主音量鎖定開關 -->
      <label class="switch" title="開啟/關閉音量自動鎖定">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- 主卡片：目標音量調節 -->
    <section class="card volume-card">
      <div class="card-row">
        <span class="section-label">目標聆聽音量</span>
        <div class="val-group">
          <span class="val-badge" id="target-val-display">50%</span>
          <button type="button" class="btn-reset" id="btn-reset-target" title="重設為預設推薦音量 50%">50% 推薦</button>
        </div>
      </div>

      <div class="slider-box">
        <input type="range" id="target-slider" min="0" max="100" step="1" value="50">
        <div class="slider-marks">
          <span>0%</span>
          <span class="mark-mid">25%</span>
          <span class="mark-rec">50% 推薦</span>
          <span class="mark-mid">75%</span>
          <span>100%</span>
        </div>
      </div>

      <!-- 即時動態狀態膠囊與纖細 VU 能量線 -->
      <div class="live-status-row">
        <div class="status-pill status-idle" id="status-pill">
          <span class="dot"></span>
          <span class="status-label" id="status-text">待命中</span>
        </div>
        <span class="comp-offset" id="comp-value-badge">+0.0 dB</span>
      </div>
      <div class="vu-track">
        <div class="vu-fill" id="vu-fill"></div>
      </div>
    </section>

    <!-- 播放速度 ＆ 固定畫質卡片 -->
    <section class="card playback-card">
      <div class="card-row">
        <span class="section-label">播放速度</span>
        <div class="speed-group" id="speed-group">
          <button type="button" class="btn-speed active" data-speed="1">1.0x</button>
          <button type="button" class="btn-speed" data-speed="1.5">1.5x</button>
          <button type="button" class="btn-speed" data-speed="2">2.0x</button>
          <button type="button" class="btn-speed btn-speed-turbo" data-speed="3" title="3倍速暴衝 (快捷鍵 Shift+3)">⚡3.0x</button>
        </div>
      </div>

      <div class="card-row card-row-quality">
        <span class="section-label">固定畫質</span>
        <div class="quality-select-wrap">
          <select id="select-quality" class="quality-select">
            <option value="auto">自動 (預設)</option>
            <option value="hd1080">1080p (Full HD 推薦)</option>
            <option value="hd1440">1440p (2K 高畫質)</option>
            <option value="hd2160">2160p (4K 極致)</option>
            <option value="hd720">720p (HD 節流)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 核心功能切換列表 -->
    <section class="feature-list">
      <!-- 功能 1: 純聽音樂模式 (遮擋畫面) -->
      <div class="feature-card" id="feature-music-mode">
        <div class="feature-icon icon-music">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h6V3h-8z"/>
          </svg>
        </div>
        <div class="feature-body">
          <div class="feature-title-row">
            <span class="feature-name">純聽音樂 (遮擋畫面)</span>
            <span class="badge-kbd" title="鍵盤快捷鍵：Shift+M">Shift+M</span>
          </div>
          <span class="feature-hint">黑屏遮罩・省電降溫・專注好音樂</span>
        </div>
        <label class="switch switch-sm" title="一鍵遮擋影片畫面">
          <input type="checkbox" id="toggle-music-mode">
          <span class="slider"></span>
        </label>
      </div>

      <!-- 功能 2: 播放清單真隨機 (True Shuffle) -->
      <div class="feature-card" id="feature-shuffle">
        <div class="feature-icon icon-shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5"></path>
            <path d="M4 20L21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="M15 15l6 6"></path>
            <path d="M4 4l5 5"></path>
          </svg>
        </div>
        <div class="feature-body">
          <div class="feature-title-row">
            <span class="feature-name">播放清單真隨機</span>
            <span class="badge-session" id="shuffle-badge" title="單次工作階段有效，重啟瀏覽器自動關閉">重開重設</span>
          </div>
          <div class="feature-hint-row">
            <span class="feature-hint" id="shuffle-status-hint">完全打亂・無偏見均勻隨機輪播</span>
            <button type="button" class="btn-star-whitelist" id="btn-star-whitelist" style="display: none;" title="設為自動隨機白名單歌單">⭐自動隨機</button>
          </div>
        </div>
        <label class="switch switch-sm" title="開啟/關閉播放清單真隨機">
          <input type="checkbox" id="toggle-shuffle">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- 進階微調 (預設優雅收合) -->
    <section class="advanced-wrap">
      <button type="button" class="btn-advanced" id="btn-toggle-advanced" aria-expanded="false">
        <span>⚙️ 進階微調</span>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </button>

      <div class="advanced-content" id="advanced-content">
        <div class="adv-group">
          <span class="adv-label">音量鎖定嚴格度</span>
          <div class="segmented-control">
            <label class="seg-item">
              <input type="radio" name="range-tightness" value="strict" checked>
              <span>嚴格 (±1dB)</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="range-tightness" value="standard">
              <span>標準 (±2dB)</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="range-tightness" value="wide">
              <span>寬鬆 (±3.5dB)</span>
            </label>
          </div>
        </div>

        <div class="adv-group">
          <span class="adv-label">調音風格模式</span>
          <div class="segmented-control">
            <label class="seg-item">
              <input type="radio" name="normalizer-mode" value="standard" checked>
              <span>廣播恆定</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="normalizer-mode" value="vocal">
              <span>人聲強化</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="normalizer-mode" value="music">
              <span>音樂原味</span>
            </label>
          </div>
        </div>

        <!-- 白名單歌單管理區塊 -->
        <div class="adv-group adv-group-whitelist">
          <div class="adv-label-row">
            <span class="adv-label">自動隨機白名單歌單</span>
            <span class="adv-count" id="whitelist-count">0 個歌單</span>
          </div>
          <div class="whitelist-input-row">
            <input type="text" id="input-whitelist-id" class="input-whitelist" placeholder="輸入清單 ID (PL...) 或貼上網址" spellcheck="false" autocomplete="off">
            <button type="button" id="btn-add-whitelist" class="btn-add-whitelist">＋加入</button>
          </div>
          <div class="whitelist-quick-bar" id="whitelist-quick-bar" style="display: none;">
            <button type="button" id="btn-quick-add-current" class="btn-quick-add" title="點擊將當前播放清單快速加入白名單">
              <span>＋將目前清單加入白名單</span>
              <span class="quick-id-badge" id="quick-current-id">PL...</span>
            </button>
          </div>
          <div class="whitelist-tags-box" id="whitelist-tags-box">
            <span class="whitelist-empty-hint" id="whitelist-empty-hint">尚未加入任何歌單（命中加入的清單將自動開啟真隨機）</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="app-footer">
      <span class="footer-note">零破音軟限制器 ＆ 智慧抗底噪門限守護中</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
